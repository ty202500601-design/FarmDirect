<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Direct - Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <header class="topbar">
        <div class="logo">
            <span class="logo-text">Farm<span>Direct</span></span>
        </div>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-title">Welcome to FarmDirect</div>
            <div class="auth-sub">Sign in to your account to continue.</div>

            <div class="tabs">
                <a href="login.html" class="tab active">Sign In</a>
                <a href="register-buyer.html" class="tab">Register</a>
            </div>

            <form action="../USER/Dashboard.html" method="get">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-input" placeholder="you@email.com" name="email" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" placeholder="••••••••" name="password" required minlength="8">
                </div>
                <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
                <button type="submit" class="btn-primary">Sign In</button>
            </form>

            <div class="divider">or sign in with</div>
            <a href="#" class="btn-outline">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google"> Continue with Google
            </a>
            <a href="#" class="btn-outline">
                <img src="https://www.svgrepo.com/show/448224/facebook.svg" alt="Facebook"> Continue with Facebook
            </a>
        </div>
    </main>

    <footer>© 2026 FarmDirect. All rights reserved. <a href="login-farmer.html" style="color:#d1d5db; font-size:11px;">Farmer</a> · <a href="login-admin.html" style="color:#d1d5db; font-size:11px;">Admin</a></footer>

</body>
</html>
