<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Direct - Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <header class="topbar">
        <div class="logo">
            🌿
            <span class="logo-text">Farm<span>Direct</span></span>
        </div>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-title">Welcome to FarmDirect</div>
            <div class="auth-sub">Choose how you'd like to continue.</div>

            <div class="role-toggle">
                <a href="login-buyer.html" class="role-btn">
                    <div class="role-icon">🛒</div>
                    <div class="role-label">Buyer</div>
                    <div class="role-desc">Shop fresh produce</div>
                </a>
                <a href="login-farmer.html" class="role-btn">
                    <div class="role-icon">🌾</div>
                    <div class="role-label">Farmer</div>
                    <div class="role-desc">Sell your harvest</div>
                </a>
            </div>

            <div class="divider">or sign in with</div>
            <a href="#" class="btn-outline">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google"> Continue with Google
            </a>
            <a href="#" class="btn-outline">
                <img src="https://www.svgrepo.com/show/448224/facebook.svg" alt="Facebook"> Continue with Facebook
            </a>
        </div>
    </main>

    <footer>© 2026 FarmDirect. All rights reserved.<a href="login-admin.html" style="color:#d1d5db; font-size:11px;">Admin</a></footer>

</body>
</html>
