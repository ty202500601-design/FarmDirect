<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Direct - Buyer Register</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <header class="topbar">
        <div class="logo">
    
            <span class="logo-text">Farm<span>Direct</span></span>
        </div>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card wide">
            <a href="login-buyer.html" class="back-btn">← Back</a>
            <div class="auth-title">Create Buyer Account</div>
            <div class="auth-sub">Fill in your details to get started.</div>

            <div class="tabs">
                <a href="login-buyer.html" class="tab">Sign In</a>
                <a href="register-buyer.html" class="tab active">Register</a>
            </div>

            <form action="login.html" method="get">
                <div class="form-group">
                    <label class="form-label">Last Name</label>
                    <input type="text" class="form-input" placeholder="Last Name" name="name" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Middle Name (optional)</label>
                    <input type="text" class="form-input" placeholder="Middle Name" name="name" >
                </div>
                <div class="form-group">
                    <label class="form-label">First Name</label>
                    <input type="text" class="form-input" placeholder="First Name" name="name" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-input" placeholder="you@email.com" name="email" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Mobile Number</label>
                    <div class="phone-wrap">
                        <div class="phone-prefix">🇵🇭 +63</div>
                        <input type="tel" class="form-input" placeholder="9XX XXX XXXX" name="phone" maxlength="10" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" placeholder="Min. 8 characters" name="password" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Delivery Address</label>
                    <input type="text" class="form-input" placeholder="Street, Barangay, City, Province" name="address" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Upload Valid Government ID</label>
                    <input type="file" class="form-input" accept=".jpg,.jpeg,.png,.pdf" name="id_file" required>
                </div>
                <div class="form-group">
                    <label class="form-label">ID Type</label>
                    <select class="form-input" name="id_type" required>
                        <option value="">Select ID type...</option>
                        <option>PhilSys / National ID</option>
                        <option>Driver's License</option>
                        <option>Passport</option>
                        <option>SSS / GSIS ID</option>
                        <option>Voter's ID</option>
                        <option>Postal ID</option>
                        <option>Other Type of ID</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Create Account</button>
            </form>
        </div>
    </main>

    <footer>© 2026 FarmDirect. All rights reserved.</footer>

</body>
</html>
