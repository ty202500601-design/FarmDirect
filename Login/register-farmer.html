<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Direct - Farmer Register</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <header class="topbar">
        <div class="logo">
            
            <span class="logo-text">Farm<span>Direct</span></span>
        </div>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card wide">
            <a href="login-farmer.html" class="back-btn">← Back</a>
            <div class="auth-title">Create Farmer Account</div>
            <div class="auth-sub">Fill in your details to get started.</div>

            <div class="tabs">
                <a href="login-farmer.html" class="tab">Sign In</a>
                <a href="register-farmer.html" class="tab active">Register</a>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label">Last Name</label>
                    <input type="text" class="form-input" placeholder="Last Name" id="regLastname" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Middle Name (optional)</label>
                    <input type="text" class="form-input" placeholder="Middle Name" id="regMiddlename">
                </div>
                <div class="form-group">
                    <label class="form-label">First Name</label>
                    <input type="text" class="form-input" placeholder="First Name" id="regFirstname" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-input" placeholder="you@email.com" id="regEmail" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" placeholder="Min. 8 characters" id="regPassword" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Farm / Business Name</label>
                    <input type="text" class="form-input" placeholder="e.g. Dela Cruz Farm" id="regFarmName" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Farm Location</label>
                    <input type="text" class="form-input" placeholder="Barangay, Municipality, Province" id="regLocation" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Produce / Products You Sell</label>
                    <input type="text" class="form-input" placeholder="e.g. Tomatoes, Carrots, Lettuce" id="regProduce" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Upload Valid Government ID</label>
                    <input type="file" class="form-input" accept=".jpg,.jpeg,.png,.pdf" id="regIdFile" required>
                </div>
                <div class="form-group">
                    <label class="form-label">ID Type</label>
                    <select class="form-input" id="regIdType" required>
                        <option value="">Select ID type...</option>
                        <option>PhilSys / National ID</option>
                        <option>Driver's License</option>
                        <option>Passport</option>
                        <option>SSS / GSIS ID</option>
                        <option>Voter's ID</option>
                        <option>Postal ID</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Farm Photo <span class="opt">(optional)</span></label>
                    <input type="file" class="form-input" accept=".jpg,.jpeg,.png" id="regFarmPhoto">
                </div>
                <button type="submit" class="btn-primary">Create Account</button>
            </form>
        </div>
    </main>

    <footer>© 2026 FarmDirect. All rights reserved.</footer>

    <script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var fn = document.getElementById('regFirstname').value.trim();
        var ln = document.getElementById('regLastname').value.trim();
        var email = document.getElementById('regEmail').value.trim().toLowerCase();
        var farm = document.getElementById('regFarmName').value.trim();
        var loc = document.getElementById('regLocation').value.trim();
        if (!fn || !ln || !email) return;
        var username = email.replace(/[^a-z0-9]/g, '_');
        localStorage.setItem('farmdirect_current_user', username);
        localStorage.setItem('farmdirect_current_email', email);
        /* Create fresh zero-state user data */
        var def = {
            profile:{ name:fn+' '+ln, avatar:null, role:'New Farmer', member:'Bronze Member', followers:0, following:0 },
            settings:{ firstname:fn, lastname:ln, suffix:'', brgy:'', city:loc, province:'', postal:'', storeName:farm, storeDesc:'', phone:'', email:email, fbPage:'', tiktok:'' },
            toRateOrders:[], myRatings:[], vouchers:[], stock:[], products:[], reports:[], nextBatchId:300
        };
        localStorage.setItem('farmdirect_sellers_' + username, JSON.stringify(def));
        window.location.href = '../Sellers/Dashboard.html';
    });
    </script>

</body>
</html>
